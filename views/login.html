<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Israeli Trips - התחברות</title>

    <link rel="stylesheet" href="/css/StyleSheet1.css">
    <link rel="stylesheet" href="/css/login.css">

    <script src="/js/login.js" defer></script>


    
</head>

<body>

   


    <main class="main-container">

        <div class="form-card">

            <h2>התחברות לחשבון</h2>

            <form id="loginForm">

                <div class="form-group">
                    <label for="username">
                        שם משתמש:
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        required
                        autocomplete="username"
                        placeholder="הכנס שם משתמש">

                    <span
                        class="error-message"
                        id="usernameError">
                    </span>
                </div>


                <div class="form-group">
                    <label for="password">
                        סיסמה:
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        autocomplete="current-password"
                        placeholder="הכנס סיסמה">

                    <span
                        class="error-message"
                        id="passwordError">
                    </span>
                </div>


                <button
                    type="submit"
                    class="submit-btn"
                    id="loginBtn">
                    התחבר
                </button>

            </form>


            <p class="form-footer">
                עוד לא נרשמת?
                <a href="register.html">
                    להרשמה לחץ כאן
                </a>
            </p>

        </div>

    </main>

</body>
</html>
