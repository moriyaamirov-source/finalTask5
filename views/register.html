<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Israeli Trips - הרשמה</title>
    <link rel="stylesheet" href="/css/StyleSheet1.css">
    <link rel="stylesheet" href="/css/register.css">
    <script src="/js/RegisterValidation.js" defer></script>
</head>

<body>
  

    <button
        type="button"
        id="logoutBtn"
    >
        התנתקות
    </button>
</div>
    </nav>


    <main class="main-container">
        <div class="form-card">
            <h2>יצירת חשבון חדש</h2>
            <form id="registerForm" novalidate>
                <div class="form-group">
                    <label for="fullName">שם מלא:</label>
                    <input type="text" id="fullName" name="fullName" placeholder="הכנס שם מלא">
                    <span class="error-message" id="fullNameError"></span>
                </div>

                <div class="form-group">
                    <label for="email">אימייל:</label>
                    <input type="email" id="email" name="email" placeholder="example@email.com">
                    <span class="error-message" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="password">סיסמה:</label>
                    <input type="password" id="password" name="password" placeholder="לפחות 6 תווים">
                    <span class="error-message" id="passwordError"></span>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">אימות סיסמה:</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="הכנס את הסיסמה שוב">
                    <span class="error-message" id="confirmPasswordError"></span>
                </div>

                <button type="submit" class="submit-btn">הירשם</button>
            </form>
            <p class="form-footer">כבר יש לך חשבון? <a href="login.html">להתחברות לחץ כאן</a></p>
        </div>
    </main>
</body>
</html>
