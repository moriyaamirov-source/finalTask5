<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Israeli Trips - מסלולי טיול ומפה</title>
    <link rel="stylesheet" href="/css/StyleSheet1.css">
    <link rel="stylesheet" href="/css/trips.css">
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/js/trips.js" defer></script>
</head>
<body>
    <nav class="navbar">
        <div class="logo">Israeli Trips</div>
        <div class="nav-links">
            <a href="homePage.html">בית</a>
            <a href="trips.html">טיולים</a>
            <a href="tips.html">טיפים</a>
            <a href="login.html">התחברות</a>
            <a href="register.html">הרשמה</a>
        </div>
    </nav>

    <main class="main-container">
        <h2>מאגר 40 המסלולים המלא של ישראל</h2>
        
        <div class="tips-btn-wrapper">
            <a href="tips.html" class="btn-main-tips">לחצו כאן לטיפים והנחיות בטיחות</a>
        </div>

        <!-- אזור מפת גוגל חינמי (Google Maps Embed) -->
        <section class="map-section" style="margin: 20px 0;">
            <h3>מפת מסלולים אינטראקטיבית</h3>
            <iframe
              id="mapFrame"
              width="100%"
              height="400"
              style="border:0; border-radius: 8px;"
              loading="lazy"
              allowfullscreen
              src="https://maps.google.com/maps?q=31.7683,35.2137&z=8&output=embed">
            </iframe>
        </section>

        <section class="add-trip-section" style="margin: 20px 0; background: #f4f8f5; padding: 20px; border-radius: 8px; border: 1px solid #c8e6c9;">
            <h3 style="margin-bottom: 15px; color: #2e7d32;">הוספת מסלול/כתובת חדשה למפה</h3>
            <form id="addTripForm" style="display: flex; flex-direction: column; gap: 10px; max-width: 600px;">
                <input type="text" id="tripTitle" placeholder="שם המסלול" required style="padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
                <input type="text" id="tripContent" placeholder="תיאור המסלול" required style="padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
                <input type="text" id="tripAddress" placeholder="כתובת / מיקום" style="padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
                
                <div style="display: flex; gap: 10px;">
                    <input type="number" step="any" id="tripLat" placeholder="קו רוחב (Latitude)" required style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
                    <input type="number" step="any" id="tripLng" placeholder="קו אורך (Longitude)" required style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
                </div>
                
                <button type="button" id="submitBtn" style="padding: 10px; background-color: #2e7d32; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 5px;">הוסף למפה ול-DB</button>
            </form>
        </section>

        <div class="search-wrapper">
            <input type="text" id="tableNameSearch" placeholder="הקלידו שם מסלול לחיפוש מהיר..." class="search-input">
        </div>

        <table class="trip-table" id="tripsTable">
            <thead>
                <tr>
                    <th>שם המסלול</th>
                    <th>אזור</th>
                    <th id="sortTimeHeader" style="cursor:pointer;" title="לחצו למיון">משך זמן (שעות) ⇅</th>
                    <th>רמת קושי</th>
                    <th>פעולות</th>
                </tr>
            </thead>
            <tbody id="tripsTableBody">
            </tbody>
        </table>
    </main>
</body>
</html>
