<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Israeli Trips - מסלולי טיול ומפה</title>
    <link rel="stylesheet" href="StyleSheet1.css">
    <link rel="stylesheet" href="trips.css">
    
    <!-- טעינת ספריית jQuery עבור בקשות Ajax -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="trips.js" defer></script>
</head>
<body>
    <nav class="navbar">
        <div class="logo">Israeli Trips</div>
        <div class="nav-links">
            <a href="homePage.html">בית</a>
            <a href="trips.html">טיולים</a>
            <a href="tips.html">טיפים</a>
            <a href="login.html">התחברות</a>
            <a href="register.html">הרשמה</a>
        </div>
    </nav>

    <main class="main-container">
        <h2>מאגר המסלולים והמפה הדיגיטלית של ישראל</h2>
        
        <div class="tips-btn-wrapper">
            <a href="tips.html" class="btn-main-tips">לחצו כאן לטיפים והנחיות בטיחות</a>
        </div>

        <!-- אזור תצוגת המפה הדיגיטלית (Google Maps) -->
        <section class="map-section" style="margin: 20px 0;">
            <h3>מפת מסלולים אינטראקטיבית</h3>
            <div id="map" style="height: 400px; width: 100%; border-radius: 8px; border: 1px solid #ccc;"></div>
        </section>

        <!-- טופס א-סינכרוני להוספת מסלול/כתובת חדשה (CRUD) -->
        <section class="add-trip-section" style="margin: 20px 0; background: #f9f9f9; padding: 15px; border-radius: 8px;">
            <h3>הוספת מסלול/כתובת חדשה למפה</h3>
            <form id="addTripForm">
                <input type="text" id="tripTitle" placeholder="שם המסלול" required style="margin: 5px; padding: 8px;">
                <input type="text" id="tripContent" placeholder="תיאור המסלול" required style="margin: 5px; padding: 8px;">
                <input type="text" id="tripAddress" placeholder="כתובת / מיקום" style="margin: 5px; padding: 8px;">
                <input type="number" step="any" id="tripLat" placeholder="קו רוחב (Latitude)" required style="margin: 5px; padding: 8px;">
                <input type="number" step="any" id="tripLng" placeholder="קו אורך (Longitude)" required style="margin: 5px; padding: 8px;">
                <button type="submit" style="padding: 8px 15px; cursor: pointer;">הוסף למפה ול-DB</button>
            </form>
        </section>

        <div class="search-wrapper">
            <input type="text" id="tableNameSearch" placeholder="הקלידו שם מסלול לחיפוש מהיר..." class="search-input">
        </div>

        <table class="trip-table" id="tripsTable">
            <thead>
                <tr>
                    <th>שם המסלול</th>
                    <th>אזור</th>
                    <th id="sortTimeHeader" style="cursor:pointer;" title="לחצו למיון">משך זמן (שעות) ⇅</th>
                    <th>רמת קושי</th>
                    <th>פעולות</th>
                </tr>
            </thead>
            <tbody id="tripsTableBody">
                <!-- המסלולים ייטענו באופן דינמי דרך Ajax -->
            </tbody>
        </table>
    </main>

    <!-- טעינת Google Maps API בצורה א-סינכרונית (המפתח מוגדר בשרת בצורה מאובטחת) -->
    <script async defer src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap"></script>
</body>
</html>
